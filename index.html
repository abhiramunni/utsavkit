<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UtsavKit — Your Indian Festival Year, Planned Ahead</title>
<meta name="description" content="Every Indian festival from today to next Christmas — dates, countdowns, a year wheel, prep checklists and long weekends. No signup, everything saved on your device.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf3e7; --paper2:#fffdf6; --ink:#2b1d12; --ink2:#5d4a33; --muted:#8a7a68;
  --bronze:#a06a2c; --bronze2:#c08a3e; --amber:#e8a33d; --gold:#d4a017; --terra:#c05b2e;
  --line:#e8dcc8; --line2:#d9c8a8; --good:#4c7a3f; --card:#fffdf6;
  --shadow:0 10px 30px rgba(43,29,18,.10); --shadow2:0 4px 14px rgba(43,29,18,.08);
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0}
p{margin:0 0 10px}
a{color:var(--bronze)}
button{font-family:inherit;cursor:pointer}
img{display:block;max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.hidden{display:none!important}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 100% at 50% 0%,#4a2c12 0%,#241407 55%,#160d05 100%);color:#f7ead2;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:opacity .6s}
#intro.hide{opacity:0;pointer-events:none}
#intro .inner{padding:24px;max-width:520px}
#intro .flame{width:74px;height:74px;margin:0 auto 18px;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.08) rotate(1.5deg)}}
#intro h1{font-size:clamp(44px,9vw,72px);color:#fbf3df;letter-spacing:.01em}
#intro h1 span{color:var(--amber)}
#intro .tag{margin:14px auto 0;max-width:380px;color:#e8d3a8;font-size:15px}
#intro .bar{width:min(280px,70vw);height:4px;background:rgba(255,255,255,.18);border-radius:99px;margin:26px auto 10px;overflow:hidden}
#intro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),#f3cf6a);animation:fill 3.6s ease forwards}
#intro.quick .bar i{animation-duration:1.1s}
@keyframes fill{to{width:100%}}
#intro .skip{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#c9a86a}
/* ---------- header ---------- */
header.site{position:sticky;top:0;z-index:60;background:rgba(250,243,231,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.site .row{display:flex;align-items:center;gap:14px;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#3a2410,#7a4a16);display:grid;place-items:center;flex:none}
.logo b{font-family:Fraunces,serif;font-size:22px}
.logo small{display:block;font-size:10px;letter-spacing:.2em;color:var(--bronze);font-weight:700}
nav.main{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav.main a{color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 11px;border-radius:99px}
nav.main a:hover{background:#f1e6cf;color:var(--ink)}
.today-pill{margin-left:6px;background:#3a2410;color:#f7ead2;border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden;background:#241407}
.hero-photo{position:relative;height:400px;overflow:hidden}
.hero-photo img{width:100%;height:100%;object-fit:cover;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateX(0)}to{transform:scale(1.12) translateX(-1.5%)}}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,13,5,.05) 40%,rgba(22,13,5,.72))}
.hero-copy{position:absolute;left:0;right:0;bottom:0;color:#fdf6e7;padding:26px 0 30px}
.hero-copy h1{font-size:clamp(32px,5.4vw,54px);max-width:640px}
.hero-copy p{color:#f0ddb6;max-width:560px;margin-top:10px}
.today-card{margin-top:-46px;position:relative;z-index:5}
.today-card .card{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:center}
.today-left h2{font-size:26px}
.today-left .date-line{color:var(--bronze);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 8px}
.today-right{text-align:right;border-left:1px dashed var(--line2);padding-left:18px}
.big-num{font-family:Fraunces,serif;font-size:52px;line-height:1;color:var(--terra)}
.big-num small{font-size:18px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f6ead2;border:1px solid var(--line2);color:#6d4c1d;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700}
.chip.gold{background:#3a2410;color:#f7ead2;border-color:#3a2410}
.chip.terra{background:#fbe9df;border-color:#eec4a8;color:#8a3a1c}
/* ---------- sections ---------- */
section{padding:34px 0 6px}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.sec-head h2{font-size:28px}
.sec-head p{color:var(--muted);margin:0}
.rule{height:1px;background:var(--line);margin:14px 0 20px}
/* next-up rail */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{height:6px}
.rail::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
.fest-card{scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow2);cursor:pointer;text-align:left;width:100%}
.fest-card:hover{border-color:var(--bronze2);transform:translateY(-2px);transition:.2s}
.fest-card .d{font-family:Fraunces,serif;font-size:15px;color:var(--terra);font-weight:700}
.fest-card h3{font-size:19px;margin:4px 0 6px}
.fest-card .meta{font-size:13px;color:var(--muted)}
.ring-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.ring-row b{font-size:13px}
.star-btn{background:none;border:0;padding:4px;margin-left:auto;color:#c9b48f}
.star-btn.on{color:var(--gold)}
/* ---------- year wheel ---------- */
.wheel-wrap{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px;display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:center}
.wheel-box{position:relative}
.wheel-box svg{width:100%;height:auto;display:block}
.wheel-dot{cursor:pointer}
.wheel-dot circle{transition:.15s}
.wheel-dot:hover circle{stroke:#fff;stroke-width:2}
.wheel-note{font-size:13px;color:var(--muted);margin-top:8px}
.wheel-side h3{font-size:22px;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.dot-key{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.dot-key i{width:11px;height:11px;border-radius:50%;display:inline-block}
.wheel-months{display:flex;flex-wrap:wrap;gap:6px}
.mchip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.mchip.on{background:#3a2410;color:#f7ead2;border-color:#3a2410}
/* ---------- month explorer + lists ---------- */
.month-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.mrow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow2);cursor:pointer;display:flex;gap:14px;align-items:flex-start}
.mrow:hover{border-color:var(--bronze2)}
.mrow .daybox{flex:none;width:58px;text-align:center;background:#f6ead2;border:1px solid var(--line2);border-radius:12px;padding:8px 4px}
.mrow .daybox b{display:block;font-family:Fraunces,serif;font-size:24px;line-height:1;color:var(--terra)}
.mrow .daybox span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.mrow h3{font-size:18px}
.mrow .meta{font-size:13px;color:var(--muted);margin-top:2px}
.mrow .count{margin-left:auto;flex:none;font-size:12px;font-weight:700;color:var(--bronze);background:#f6ead2;border-radius:99px;padding:4px 9px}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}
/* ---------- long weekends ---------- */
.lw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lw{background:linear-gradient(135deg,#3a2410,#6b3f14);color:#f7ead2;border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.lw .when{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#e8c07a;font-weight:700}
.lw h3{font-size:21px;margin:6px 0}
.lw p{color:#ecd9ae;font-size:14px;margin:0}
.lw .take{margin-top:12px;display:inline-block;background:rgba(232,163,61,.18);border:1px solid rgba(232,163,61,.5);color:#ffd98a;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700}
/* ---------- photo band ---------- */
.band{border-radius:24px;overflow:hidden;margin:30px 0 4px;position:relative;height:260px}
.band img{width:100%;height:100%;object-fit:cover;animation:kb 30s ease-in-out infinite alternate}
